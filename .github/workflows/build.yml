name: Build AAB
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - run: flutter pub get
      - run: |
          python3 << 'PYEOF'
          import pathlib
          for name in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              t = p.read_text()
              if 'signingConfigs' in t:
                  continue
              if name.endswith('.kts'):
                  t = t.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName("debug")\n        }')
                  t = t.replace('release {', 'release {')
              else:
                  t = t.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.debug\n        }')
                  t = t.replace('release {', 'release {')
              p.write_text(t)
              print('patched', name)
          PYEOF
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
