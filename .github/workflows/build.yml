name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: |
          # Hifadhi code yako
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          if [ -d assets ]; then cp -r assets /tmp/assets_backup; fi
          # Tafuta package name ya zamani
          PKG=$(grep -r "applicationId" android/app/build.gradle* 2>/dev/null | head -1 | sed 's/.*applicationId.*["'\'']\(.*\)["'\''].*/\1/' | tr -d '"'"' ')
          if [ -z "$PKG" ]; then PKG="com.example.swahilitok"; fi
          echo "OLD_PKG=$PKG" > /tmp/pkg.txt
          cat /tmp/pkg.txt
          # Futa android ya zamani kabisa
          rm -rf android
          # Tengeneza android mpya safi
          flutter create --project-name=swahilitok --org=com.example --platforms=android .
          # Rudisha code yako
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          if [ -d /tmp/assets_backup ]; then cp -r /tmp/assets_backup assets; fi
          # Weka package name ya zamani
          OLD_PKG=$(cat /tmp/pkg.txt | cut -d= -f2)
          echo "Restoring package $OLD_PKG"
          sed -i "s/applicationId.*/applicationId \"$OLD_PKG\"/" android/app/build.gradle.kts 2>/dev/null || true
          sed -i "s/applicationId.*/applicationId \"$OLD_PKG\"/" android/app/build.gradle 2>/dev/null || true
          sed -i "s/namespace.*/namespace \"$OLD_PKG\"/" android/app/build.gradle.kts 2>/dev/null || true
          sed -i "s/namespace.*/namespace \"$OLD_PKG\"/" android/app/build.gradle 2>/dev/null || true
          flutter pub get
      - run: |
          mkdir -p android/app
          rm -f android/app/upload-keystore.jks
          keytool -genkeypair -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -d "CN=SwahiliTok, OU=Dev, O=SwahiliTok, L=Dar, ST=Dar, C=TZ"
      - run: |
          python3 << 'PYEOF'
          import pathlib
          for name in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              t = p.read_text()
             
