name: Build AAB
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: |
          python3 << 'PYEOF'
          import pathlib, re, shutil
          # Tafuta package name
          pkg = 'com.example.swahilitok'
          for p in pathlib.Path('android').rglob('*.gradle*'):
              try:
                  t = p.read_text(errors='ignore')
                  m = re.search(r'applicationId\s+["\']([^"\']+)', t)
                  if m:
                      pkg = m.group(1)
                      break
              except:
                  pass
          print('package:', pkg)
          dollar = chr(36)
          app_name = dollar + '{applicationName}'
          content = '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="' + pkg + '">\n'
          content += '  <application android:label="SwahiliTok" android:name="' + app_name + '" android:icon="@mipmap/ic_launcher">\n'
          content += '    <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">\n'
          content += '      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />\n'
          content += '      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>\n'
          content += '    </activity>\n'
          content += '    <meta-data android:name="flutterEmbedding" android:value="2" />\n'
          content += '  </application>\n</manifest>\n'
          pathlib.Path('android/app/src/main').mkdir(parents=True, exist_ok=True)
          pathlib.Path('android/app/src/main/AndroidManifest.xml').write_text(content)
          shutil.copy('android/app/src/main/AndroidManifest.xml', 'android/AndroidManifest.xml')
          print('manifest fixed')
          # Fix MainActivity
          for p in pathlib.Path('android').rglob('MainActivity.*'):
              try:
                  t = p.read_text(errors='ignore')
                  t = t.replace('io.flutter.app.FlutterActivity', 'io.flutter.embedding.android.FlutterActivity')
                  t = t.replace('io.flutter.app.FlutterFragmentActivity', 'io.flutter.embedding.android.FlutterFragmentActivity')
                  p.write_text(t)
                  print('fixed', p)
              except:
                  pass
          PYEOF
      - run: |
          mkdir -p android/app
          rm -f android/app/upload-keystore.jks
          keytool -genkeypair -v -keystore android/app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=SwahiliTok, OU=Dev, O=SwahiliTok, L=Dar, ST=Dar, C=TZ" -noprompt
      - run: |
          python3 << 'PYEOF'
          import pathlib
          for name in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              t = p.read_text()
              if 'signingConfigs' in t:
                  continue
              if name.endswith('.kts'):
                  t = t.replace('buildTypes {', 'signingConfigs { create("release") { keyAlias = "upload"; keyPassword = "123456"; storeFile = file("upload-keystore.jks"); storePassword = "123456" } }\n            buildTypes {')
                  t = t.replace('release {', 'release { signingConfig = signingConfigs.getByName("release")')
              else:
                  t = t.replace('buildTypes {', 'signingConfigs { release { keyAlias "upload"; keyPassword "123456"; storeFile file("upload-keystore.jks"); storePassword "123456" } }\n        buildTypes {')
                  t = t.replace('release {', 'release { signingConfig signingConfigs.release')
              p.write_text(t)
              print('patched', name)
          PYEOF
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
