name: Build AAB
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: |
          # Hifadhi code yako
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          if [ -d assets ]; then cp -r assets /tmp/assets_backup; fi
          # Tafuta package name ya zamani
          PKG=$(grep -r "applicationId" android/app/build.gradle* 2>/dev/null | head -1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
          if [ -z "$PKG" ]; then PKG="com.example.swahilitok"; fi
          echo "OLD PKG=$PKG" > /tmp/pkg.txt
          cat /tmp/pkg.txt
          # Futa android ya zamani kabisa
          rm -rf android
          # Tengeneza android mpya safi
          flutter create --project-name=swahilitok --org=com.example --platforms=android .
          # Rudisha code yako
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          if [ -d /tmp/assets_backup ]; then rm -rf assets; cp -r /tmp/assets_backup assets; fi
          # Weka package name ya zamani kama ilikuwepo
          OLD_PKG=$(cat /tmp/pkg.txt | cut -d= -f2)
          echo "Restoring package $OLD_PKG"
          sed -i "s/applicationId.*/applicationId \"$OLD_PKG\"/" android/app/build.gradle || true
          sed -i "s/namespace.*/namespace \"$OLD_PKG\"/" android/app/build.gradle || true
          flutter pub get
      - run: |
          mkdir -p android/app
          rm -f android/app/upload-keystore.jks
          keytool -genkeypair -v -keystore android/app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=SwahiliTok, OU=Dev, O=SwahiliTok, L=Dar, ST=Dar, C=TZ" -noprompt
      - run: |
          python3 << 'PYEOF'
          import pathlib
          for name in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              t = p.read_text()
              if 'signingConfigs' in t:
                  continue
              if name.endswith('.kts'):
                  t = t.replace('buildTypes {', 'signingConfigs { create("release") { keyAlias = "upload"; keyPassword = "123456"; storeFile = file("upload-keystore.jks"); storePassword = "123456" } }\n            buildTypes {')
                  t = t.replace('release {', 'release { signingConfig = signingConfigs.getByName("release")')
              else:
                  t = t.replace('buildTypes {', 'signingConfigs { release { keyAlias "upload"; keyPassword "123456"; storeFile file("upload-keystore.jks"); storePassword "123456" } }\n        buildTypes {')
                  t = t.replace('release {', 'release { signingConfig signingConfigs.release')
              p.write_text(t)
              print('patched', name)
          PYEOF
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
